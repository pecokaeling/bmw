<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>华晨宝马数据分析</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #142033;
      --muted: #657188;
      --line: #d9e1ee;
      --blue: #185abc;
      --blue-soft: #e9f1ff;
      --shadow: 0 14px 38px rgba(20, 32, 51, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 680px;
      width: 100%;
      padding: 48px 32px;
    }
    .site-header {
      text-align: center;
      margin-bottom: 48px;
    }
    .site-header h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 12px;
      color: var(--ink);
    }
    .site-header p {
      font-size: 15px;
      color: var(--muted);
      margin: 0;
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--panel);
      border-radius: 12px;
      padding: 32px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 48px rgba(20, 32, 51, 0.12);
    }
    .card h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px;
      color: var(--ink);
    }
    .card p {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
    .card .tag {
      display: inline-block;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 4px;
      margin-top: 12px;
      font-weight: 500;
    }
    .tag-blue {
      background: var(--blue-soft);
      color: var(--blue);
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="site-header">
      <h1>华晨宝马数据分析</h1>
      <p>历史经营数据与分红统计一览</p>
    </div>
    <div class="card-list">
      <a class="card" href="dividend_stats.html">
        <h2>分红统计</h2>
        <p>2022年以来华晨宝马分红数据汇总，含分红率、金额及趋势分析</p>
        <span class="tag tag-blue">分红数据</span>
      </a>
      <a class="card" href="brilliance_bmw_history_query.html">
        <h2>历史经营数据查询</h2>
        <p>华晨宝马历史经营数据查询底稿，涵盖收入、利润、资产等关键指标</p>
        <span class="tag tag-blue">经营数据</span>
      </a>
    </div>
    <div class="footer">华晨宝马数据分析报告</div>
  </div>
</body>
</html>
